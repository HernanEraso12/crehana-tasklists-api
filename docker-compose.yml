services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crehana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crehana}
      POSTGRES_DB: ${POSTGRES_DB:-crehana_tasklists}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-crehana} -d ${POSTGRES_DB:-crehana_tasklists}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crehana}:${POSTGRES_PASSWORD:-crehana}@db:5432/${POSTGRES_DB:-crehana_tasklists}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # La imagen slim no trae curl; se usa Python (ya está en la imagen).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
