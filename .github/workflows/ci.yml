name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: flake8
        run: uv run flake8

      - name: black --check
        run: uv run black --check .

      - name: isort --check-only
        run: uv run isort --check-only .

  tests:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: pytest (suite completa, con cobertura)
        run: uv run pytest

  tests-postgres:
    name: Tests de integración (PostgreSQL)
    runs-on: ubuntu-latest
    # Cierra el riesgo de diferencias de dialecto SQLite/Postgres (A7):
    # corre los mismos tests marcados `integration` contra un
    # PostgreSQL real, no solo contra SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crehana
          POSTGRES_PASSWORD: crehana
          POSTGRES_DB: crehana_tasklists_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crehana -d crehana_tasklists_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://crehana:crehana@localhost:5432/crehana_tasklists_test
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: pytest -m integration (contra PostgreSQL real)
        run: uv run pytest -m integration --no-cov

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t crehana-tasklists-api:ci .
